[project]
name = "schema-viewer"
version = "0.2.0"
description = "Read-only schema visualizer for SQLAlchemy/Alembic projects"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mitej Madan" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "click>=8.1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
mysql = ["pymysql>=1.1"]

[project.scripts]
schema-viewer = "schema_viewer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schema_viewer"]

[tool.hatch.build.targets.wheel.force-include]
"src/schema_viewer/static" = "schema_viewer/static"
